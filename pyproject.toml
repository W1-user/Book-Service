[project]
name = "bookservice"
version = "0.1.0"
description = "A book service for buying and selling books"
authors = [
    {name = "W1-user",email = "wolframgit@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "greenlet (>=3.4.0,<4.0.0)",
    "psycopg (>=3.3.3,<4.0.0)",
    "psycopg-binary (>=3.3.3,<4.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "pydantic[email] (>=2.13.3,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "cryptography (>=47.0.0,<48.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false